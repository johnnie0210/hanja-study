name: Update hanja data

on:
  push:
    branches: [main]
    paths:
      - '기말_한자.xlsx'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hanja-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: build/package-lock.json

      - name: Install dependencies
        working-directory: build
        run: npm ci

      - name: Generate data.js from Excel
        working-directory: build
        run: node parse-xlsx.mjs "../기말_한자.xlsx"

      - name: Commit updated data.js
        run: |
          if git diff --quiet -- data.js; then
            echo "data.js changed: no"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "chore: 기말_한자.xlsx 내용 반영 [skip ci]"
          git push
